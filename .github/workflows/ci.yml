name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.8", "3.12"]
        exclude:
          - os: macos-latest
            python: "3.8"   # no 3.8 build for arm64 runners; 3.8 is covered on Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Shell syntax
        run: |
          for f in install.sh test/*.sh scripts/*.sh plugins/*/skills/*/scripts/*.sh; do
            [ -f "$f" ] || continue
            # check with the interpreter the shebang names (bash scripts use arrays)
            if head -n 1 "$f" | grep -q bash; then bash -n "$f"; else sh -n "$f"; fi
          done
      - name: CLI smoke
        run: |
          python bin/podium --help
          python scripts/check-versions.py

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
